spring:
  config:
    import: "optional:file:.env[.properties]"

  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    # 스키마는 db/migration.sql로 수동 관리한다 (data-model.md — 백업이 없어 스키마를 코드로 관리).
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        format_sql: true
        show_sql: false

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

app:
  internal-token: ${INTERNAL_TOKEN:}
  # true면 AI-server를 호출하지 않고 사전 저장된 응답 세트를 반환한다 (F11-03, Phase 6에서 구현)
  demo-mode: ${DEMO_MODE:false}
  ai-server-url: ${AI_SERVER_URL:}

cors:
  # localhost:5173 = Vite 개발 서버 (2026-08-24 확정). 와일드카드 패턴은 쓰지 않는다.
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}

logging:
  level:
    com.haebing.backend: info
  # F11-04 — 오류 로그에 세션 해시·엔드포인트가 실리도록 MDC(SessionInterceptor가 심음)를 포함한다.
  # 이미지 내용·추출 텍스트·소명서 본문·파일명은 어떤 로그 문구에도 넣지 않는다.
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} %-5level [%X{sessionHash:-'-'}] [%X{endpoint:-'-'}] %logger{36} - %msg%n"
