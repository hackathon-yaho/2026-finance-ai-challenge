spring:
  config:
    import: "optional:file:.env[.properties]"

  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    # 스키마는 db/migration.sql로 수동 관리한다 (data-model.md — 백업이 없어 스키마를 코드로 관리).
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        format_sql: true
        show_sql: false

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

app:
  internal-token: ${INTERNAL_TOKEN:}
  # true면 AI-server를 호출하지 않고 사전 저장된 응답 세트를 반환한다 (F11-03, Phase 6에서 구현)
  demo-mode: ${DEMO_MODE:false}

cors:
  # localhost:5173 = Vite 개발 서버 (2026-08-24 확정). 와일드카드 패턴은 쓰지 않는다.
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}

logging:
  level:
    com.haebing.backend: info
